<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TID Sheet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    color: #000;
    background: #fff;
    line-height: 1.3;
  }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #1B5E20; color: #fff; padding: 8px 16px;
    display: flex; align-items: center; gap: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #toolbar span { font-size: 14px; font-weight: 600; flex: 1; }
  #toolbar button {
    background: #fff; color: #1B5E20; border: none; padding: 6px 18px;
    border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;
  }

  .page {
    width: 80mm;
    margin: 48px auto 20px;
    padding: 12px;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  .receipt-header {
    text-align: center;
    margin-bottom: 8px;
  }
  .receipt-logo {
    max-height: 45px;
    margin-bottom: 6px;
  }
  .company {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  .station-info {
    font-size: 10px;
    margin-top: 2px;
    text-align: center;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin: 6px 0;
    font-weight: bold;
  }

  .doc-title {
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    border: 1.5px solid #000;
    padding: 3px 0;
    margin: 6px 0;
    text-transform: uppercase;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 4px;
  }
  th {
    border-bottom: 1px dashed #000;
    border-top: 1px dashed #000;
    padding: 3px 0;
    font-weight: bold;
    text-align: left;
  }
  td {
    padding: 3px 0;
    vertical-align: middle;
  }

  .num { text-align: right; }
  .center { text-align: center; }

  .divider {
    border-top: 1px dashed #000;
    margin: 6px 0;
  }
  .double-divider {
    border-top: 1.5px solid #000;
    border-bottom: 1.5px solid #000;
    height: 3px;
    margin: 6px 0;
  }

  .section-header {
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .signatures {
    margin-top: 30px;
    font-size: 11px;
    display: flex;
    justify-content: space-between;
  }
  .sig-line {
    border-top: 1px dashed #000;
    width: 30%;
    text-align: center;
    padding-top: 3px;
  }

  .print-footer {
    text-align: center;
    font-size: 9px;
    color: #666;
    margin-top: 20px;
    border-top: 1px dashed #ccc;
    padding-top: 4px;
  }

  @media print {
    #toolbar { display: none !important; }
    body { margin: 0; background: #fff; }
    .page { width: 100%; margin: 0; border: none; padding: 0; box-shadow: none; }
    @page { size: 80mm auto; margin: 0; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <span id="toolbarTitle">📋 TID Sheet</span>
  <button onclick="window.print()">🖨️ Print</button>
  <button onclick="window.close()">✖ Close</button>
</div>

<div class="page">
  <div class="receipt-header">
    <img id="logo" class="receipt-logo" style="display: none;" src="" alt="logo" />
    <div class="company" id="headerStationName">KANDHARE PETROLEUM</div>
    <div class="station-info" id="stationSubtitle">Kandhare Nangade Surve Group</div>
  </div>

  <div class="meta-row">
    <span>No. : <span id="metaNo">_______</span></span>
    <span>Date : <span id="metaDate"></span></span>
  </div>

  <div class="doc-title">TID SHEET</div>

  <!-- Cards Table -->
  <table id="cardsTable">
    <thead>
      <tr>
        <th style="width: 40%;">TID NO</th>
        <th style="width: 35%;">BATCH NO</th>
        <th style="width: 25%;" class="num">Amount</th>
      </tr>
    </thead>
    <tbody id="cardsBody">
      <!-- populated dynamically -->
    </tbody>
  </table>

  <div class="divider"></div>

  <!-- PHON PAY SUMMARY -->
  <div class="section-header">PHON PAY</div>
  <table id="phonePeTable">
    <tbody>
      <!-- populated dynamically -->
    </tbody>
  </table>

  <div class="divider"></div>

  <!-- CARD SUMMARY -->
  <div class="section-header">CARD</div>
  <table id="cardSummaryTable">
    <tbody>
      <!-- populated dynamically -->
    </tbody>
  </table>

  <div class="divider"></div>

  <!-- P. CARD SUMMARY -->
  <div class="section-header">P. CARD</div>
  <table id="petroTable">
    <tbody>
      <!-- populated dynamically -->
    </tbody>
  </table>

  <div class="divider"></div>

  <!-- GRAND TOTAL -->
  <table style="font-weight: bold; font-size: 13px; margin-top: 10px;">
    <tr>
      <td>TOTAL</td>
      <td class="num" id="grandTotalVal">0.00</td>
    </tr>
  </table>

  <!-- Signatures -->
  <div class="signatures">
    <div class="sig-line">Supervisor</div>
    <div class="sig-line">Manager</div>
    <div class="sig-line">Owner</div>
  </div>

  <div class="print-footer" id="printFooter"></div>
</div>

<script>
const data = /* INJECT_JSON_HERE */{};

// Format function
const fmt = (v) => {
  if (v === undefined || v === null || v === 0) return '-';
  // Round to nearest whole number if it has no decimal part, otherwise show 2 decimals
  if (v % 1 === 0) return v.toFixed(0);
  return v.toFixed(2);
};

const station = data.stationName || 'Kandhare Petroleum';
document.title = station + ' — TID Sheet';
document.getElementById('toolbarTitle').textContent = `📋 ${station} — TID Sheet`;
document.getElementById('headerStationName').textContent = station.toUpperCase();

if (station.toUpperCase().includes('KANDHARE')) {
  document.getElementById('stationSubtitle').innerHTML = 
    'Kandhare Nangade Surve Group<br/>Gat No. 119/B Jamgaon, Taluka Mulshi, Dist - Pune.<br/>Tel. : 8975549999 / 9850846783';
} else {
  document.getElementById('stationSubtitle').innerHTML = 'Fuel & Digital Settlement Sheet';
}

if (data.logo) {
  const logoImg = document.getElementById('logo');
  if (logoImg) {
    logoImg.src = data.logo;
    logoImg.style.display = 'block';
  }
}

document.getElementById('metaDate').textContent = data.date || '';

// Load Individual Cards
const cb = document.getElementById('cardsBody');
let cardsHtml = '';
if (data.cards && data.cards.length > 0) {
  data.cards.forEach(c => {
    cardsHtml += `<tr>
      <td>${c.tid || ''}</td>
      <td>${c.batch || ''}</td>
      <td class="num">${fmt(c.amount)}</td>
    </tr>`;
  });
  // Add subtotal row
  cardsHtml += `<tr style="border-top: 1px dashed #000; font-weight: bold;">
    <td></td>
    <td></td>
    <td class="num">${fmt(data.cardTotal)}</td>
  </tr>`;
} else {
  cardsHtml = '<tr><td colspan="3" class="center">No credit card transactions</td></tr>';
}
cb.innerHTML = cardsHtml;

// Load PhonePe Summary
const phonePeBody = document.querySelector('#phonePeTable tbody');
let phonePeHtml = '';
const pSum = data.phonePeSummary || { morning: 0, day: 0, night: 0, total: 0 };
phonePeHtml += `<tr>
  <td style="width: 20%;">I</td>
  <td style="width: 60%;">${fmt(pSum.morning)}</td>
  <td style="width: 20%;" class="num">M</td>
</tr>`;
phonePeHtml += `<tr>
  <td>II</td>
  <td>${fmt(pSum.day)}</td>
  <td class="num"></td>
</tr>`;
phonePeHtml += `<tr>
  <td>I</td>
  <td>${fmt(pSum.night)}</td>
  <td class="num">N</td>
</tr>`;
phonePeHtml += `<tr style="border-top: 1px dashed #000; font-weight: bold;">
  <td></td>
  <td>${fmt(pSum.total)}</td>
  <td></td>
</tr>`;
phonePeBody.innerHTML = phonePeHtml;

// Load Card Summary
const cardSummaryBody = document.querySelector('#cardSummaryTable tbody');
let cardSummaryHtml = '';
const cSum = data.cardSummary || { morning: 0, day: 0, night: 0, total: 0 };
cardSummaryHtml += `<tr>
  <td style="width: 20%;">I</td>
  <td style="width: 60%;">${fmt(cSum.morning)}</td>
  <td style="width: 20%;" class="num">M</td>
</tr>`;
cardSummaryHtml += `<tr>
  <td>II</td>
  <td>${fmt(cSum.day)}</td>
  <td class="num"></td>
</tr>`;
cardSummaryHtml += `<tr>
  <td>I</td>
  <td>${fmt(cSum.night)}</td>
  <td class="num">N</td>
</tr>`;
cardSummaryHtml += `<tr style="border-top: 1px dashed #000; font-weight: bold;">
  <td></td>
  <td>${fmt(cSum.total)}</td>
  <td></td>
</tr>`;
cardSummaryBody.innerHTML = cardSummaryHtml;

// Load Petro Card Summary
const petroBody = document.querySelector('#petroTable tbody');
let petroHtml = '';
const petroSum = data.petroSummary || { night: 0, day: 0, total: 0 };
petroHtml += `<tr>
  <td style="width: 20%;">I</td>
  <td style="width: 80%;">${fmt(petroSum.night)}</td>
</tr>`;
petroHtml += `<tr>
  <td>II</td>
  <td>${fmt(petroSum.day)}</td>
</tr>`;
petroHtml += `<tr style="border-top: 1px dashed #000; font-weight: bold;">
  <td></td>
  <td>${fmt(petroSum.total)}</td>
</tr>`;
petroBody.innerHTML = petroHtml;

// Grand Total
document.getElementById('grandTotalVal').textContent = fmt(data.grandTotal || 0);

document.getElementById('printFooter').textContent =
  `${station} | TID Sheet | ${data.date} | Printed: ${new Date().toLocaleString('en-IN')}`;
</script>
</body>
</html>
