<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Card Settlement Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; color: #111; background: #fff; }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #1B5E20; color: #fff; padding: 8px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  #toolbar span { font-size: 14px; font-weight: 600; flex: 1; }
  #toolbar button {
    background: #fff; color: #1B5E20; border: none; padding: 6px 18px;
    border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;
  }

  .page {
    width: 210mm; min-height: 297mm;
    margin: 48px auto 20px; padding: 14mm 12mm 10mm;
    background: #fff; border: 1px solid #ccc;
  }

  .header { text-align: center; border-bottom: 2.5px solid #1976D2; padding-bottom: 8px; margin-bottom: 12px; }
  .header .company { font-size: 18px; font-weight: 700; color: #1976D2; letter-spacing: 1px; }
  .header .station { font-size: 13px; font-weight: 600; color: #333; }
  .header .doc-title { font-size: 12px; font-weight: 700; color: #555; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

  .meta-row { display: flex; gap: 40px; margin-bottom: 12px; font-size: 11px; }
  .meta-item { display: flex; gap: 6px; }
  .meta-label { font-weight: 600; color: #555; }
  .meta-value { font-weight: 500; color: #111; }

  table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 14px; border: 1.5px solid #1976D2; }
  th {
    background: #1976D2; color: #fff; font-weight: 700;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px;
    padding: 6px 8px; border: 1.5px solid #1565C0; text-align: center;
  }
  td { padding: 5px 8px; border: 1px solid #90CAF9; vertical-align: middle; }
  tr:nth-child(even) td { background: #F5F5F5; }
  
  .group-header-row td {
    background: #E3F2FD !important;
    font-weight: 700;
    font-size: 11px;
    color: #0D47A1;
    border-top: 1.5px solid #1976D2;
    border-bottom: 1.5px solid #1976D2;
    text-transform: uppercase;
  }
  
  .group-total-row td {
    background: #FFF9C4 !important; /* Soft yellow highlight */
    font-weight: 700;
    border-top: 1.5px solid #1976D2;
    border-bottom: 1.5px solid #1976D2;
  }
  
  .summary-row td {
    background: #FFF59D !important; /* Deeper yellow highlight */
    font-weight: 700;
    border-top: 1.5px solid #1976D2;
    border-bottom: 1.5px solid #1976D2;
    font-size: 12px;
  }

  .num { text-align: right; }
  .center { text-align: center; }

  .sum-diff-pos { color: #d32f2f; }
  .sum-diff-neg { color: #1976d2; }
  .sum-diff-zero { color: #388e3c; }

  .signatures {
    display: grid; grid-template-columns: repeat(3,1fr);
    gap: 20px; margin-top: 36px; text-align: center;
  }
  .sig-box { border-top: 1.5px solid #333; padding-top: 6px; font-size: 10px; font-weight: 600; }

  .print-footer { text-align: center; font-size: 9px; color: #999; margin-top: 24px; border-top: 1px solid #eee; padding-top: 6px; }

  @media print {
    #toolbar { display: none !important; }
    body { margin: 0; }
    .page { width: 100%; margin: 0; border: none; padding: 10mm; min-height: auto; }
    @page { size: A4 portrait; margin: 10mm 8mm; }
    th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <span id="toolbarTitle">📋 Digital Payments Summary</span>
  <button onclick="window.print()">🖨️ Print / Save PDF</button>
  <button onclick="window.close()">✖ Close</button>
</div>

<div class="page">

  <div class="header" style="display: flex; align-items: center; justify-content: center; gap: 15px;">
    <img id="logo" style="display: none; height: 50px;" src="" alt="logo" />
    <div style="text-align: left;">
      <div class="company" id="headerStationName">PETROLEUM</div>
      <div class="doc-title" style="margin-top: 0;">Credit Card Settlement & Digital Summary</div>
    </div>
  </div>

  <div class="meta-row">
    <div class="meta-item"><span class="meta-label">Date:</span><span class="meta-value" id="metaDate"></span></div>
    <div class="meta-item"><span class="meta-label">Shift:</span><span class="meta-value" id="metaShift"></span></div>
    <div class="meta-item"><span class="meta-label">Printed:</span><span class="meta-value" id="metaPrinted"></span></div>
  </div>

  <!-- Unified Settlement Table -->
  <table>
    <thead>
      <tr>
        <th style="width: 8%;">No.</th>
        <th style="width: 32%;">Salesperson (DSM)</th>
        <th style="width: 25%;">TID NO</th>
        <th style="width: 20%;">BATCH NO</th>
        <th class="num" style="width: 15%;">Amount (₹)</th>
      </tr>
    </thead>
    <tbody id="settlementBody"></tbody>
  </table>

  <!-- Signatures -->
  <div class="signatures">
    <div class="sig-box">Salesperson / Supervisor</div>
    <div class="sig-box">Manager Signature</div>
    <div class="sig-box">Owner Signature</div>
  </div>

  <div class="print-footer" id="printFooter"></div>
</div>

<script>
const data = /* INJECT_JSON_HERE */{};
const INR = (n) => '₹' + (+(n||0)).toLocaleString('en-IN', {minimumFractionDigits:2,maximumFractionDigits:2});

const station = data.stationName || 'Shree Mahakaleshwar Petroleum';
document.title = station + ' — Card Settlement Report';
document.getElementById('toolbarTitle').textContent = `📋 ${station} — Digital Summary`;
document.getElementById('headerStationName').textContent = station.toUpperCase();

if (data.logo) {
  const logoImg = document.getElementById('logo');
  if (logoImg) {
    logoImg.src = data.logo;
    logoImg.style.display = 'block';
  }
}

document.getElementById('metaDate').textContent = data.date || '';
document.getElementById('metaShift').textContent = 'Shift ' + (data.shiftLabel || '');
document.getElementById('metaPrinted').textContent = data.printedAt || new Date().toLocaleString('en-IN');

const sb = document.getElementById('settlementBody');
let html = '';

// Card Payments
let cardTotal = 0;
if (data.cards && data.cards.length > 0) {
  data.cards.forEach(c => {
    cardTotal += c.amount;
    html += `<tr>
      <td class="center font-weight-bold">${c.romanIndex}</td>
      <td>${c.name}</td>
      <td class="center">${c.tid || ''}</td>
      <td class="center">${c.batch || ''}</td>
      <td class="num">${INR(c.amount)}</td>
    </tr>`;
  });
  html += `<tr class="group-total-row">
    <td></td>
    <td class="font-weight-bold" style="text-transform: uppercase;">Card</td>
    <td></td>
    <td></td>
    <td class="num font-weight-bold">${INR(cardTotal)}</td>
  </tr>`;
}

// PhonePe Payments
let phoneTotal = 0;
if (data.phonePes && data.phonePes.length > 0) {
  data.phonePes.forEach(p => {
    phoneTotal += p.amount;
    html += `<tr>
      <td class="center font-weight-bold">${p.romanIndex}</td>
      <td>${p.name}</td>
      <td class="center">${p.tid || ''}</td>
      <td class="center">${p.batch || ''}</td>
      <td class="num">${INR(p.amount)}</td>
    </tr>`;
  });
  html += `<tr class="group-total-row">
    <td></td>
    <td class="font-weight-bold" style="text-transform: lowercase;">phone pay</td>
    <td></td>
    <td></td>
    <td class="num font-weight-bold">${INR(phoneTotal)}</td>
  </tr>`;
}

// Petro Card Payments
let petroTotal = 0;
if (data.petroCards && data.petroCards.length > 0) {
  data.petroCards.forEach(pc => {
    petroTotal += pc.amount;
    html += `<tr>
      <td class="center font-weight-bold">${pc.romanIndex}</td>
      <td>${pc.name}</td>
      <td class="center">${pc.tid || ''}</td>
      <td class="center">${pc.batch || ''}</td>
      <td class="num">${INR(pc.amount)}</td>
    </tr>`;
  });
  html += `<tr class="group-total-row">
    <td></td>
    <td class="font-weight-bold" style="text-transform: lowercase;">petro card</td>
    <td></td>
    <td></td>
    <td class="num font-weight-bold">${INR(petroTotal)}</td>
  </tr>`;
}

// No summary rows needed anymore

sb.innerHTML = html;

document.getElementById('printFooter').textContent =
  `${station} | Digital Summary | ${data.date} | Shift ${data.shiftLabel} | Printed: ${data.printedAt || new Date().toLocaleString('en-IN')}`;
</script>
</body>
</html>
